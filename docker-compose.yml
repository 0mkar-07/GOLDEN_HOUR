services:
  postgres:
    image: postgres:16-alpine
    container_name: goldenhour-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: goldenhour
      POSTGRES_PASSWORD: goldenhour_dev_password
      POSTGRES_DB: goldenhour
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldenhour -d goldenhour"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
